name: CI
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: intake, POSTGRES_PASSWORD: intake, POSTGRES_DB: intake_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U intake" --health-interval 5s --health-retries 10
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      # Migrations run first, on the still-empty database; then check the
      # models and migrations agree (no un-migrated schema changes).
      - name: migrations apply cleanly and match the models
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
        env:
          INTAKE_DATABASE_URL: postgresql+psycopg://intake:intake@localhost:5432/intake_test
          INTAKE_DATABASE_SSLMODE: disable
      - name: pytest (Postgres)
        run: pytest -q
        env: { TEST_DATABASE_URL: "postgresql+psycopg://intake:intake@localhost:5432/intake_test" }

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci
      - run: npm run build

  infra:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: infra } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci
      - run: npm run build

  office:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: office scripts parse
        run: bash -n office/office.sh && sh -n office/backup.sh
      - name: office compose file is valid
        run: |
          printf 'POSTGRES_PASSWORD=ci\nSITE_HOST=localhost\n' > office/.env
          docker compose -f docker-compose.office.yml --env-file office/.env config --quiet
      - name: office image builds
        run: docker build -t dental-intake-app:ci .

  windows:
    # Builds DentalIntakeSetup.exe and really installs it on a Windows machine.
    runs-on: windows-latest
    timeout-minutes: 60
    defaults: { run: { shell: pwsh } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Desktop unit tests
        run: |
          python -m pip install -r desktop/requirements.txt pytest httpx
          python -m pytest -q desktop/tests
      - name: Build installer
        run: ./desktop/build_windows.ps1

      - name: "Connect-to-office-PC install: wrong security code is refused"
        run: |
          $env:DENTAL_INTAKE_HOME = "C:\portable-server"
          $exe = "desktop\dist\DentalIntake\DentalIntakeServer.exe"
          & $exe setup --office-name "Portable" --https-port 443 --public-host localhost --result-file C:\portable.txt
          if ($LASTEXITCODE -ne 0) { throw "portable setup failed" }
          $code = ((Get-Content C:\portable.txt) -match '^security_code=') -replace 'security_code=', ''
          $httpPort = ((Get-Content C:\portable.txt) -match '^http_port=') -replace 'http_port=', ''
          "portable server security code: $code (certificate helper on port $httpPort)"
          $srv = Start-Process $exe -ArgumentList serve -PassThru -WindowStyle Hidden
          Start-Sleep 10
          (Invoke-WebRequest -UseBasicParsing "http://localhost:$httpPort/office-ca.crt").StatusCode

          $p = Start-Process desktop\dist\DentalIntakeSetup.exe -Wait -PassThru -ArgumentList `
            '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /LOG=C:\ws-bad.log /ROLE=workstation /SERVER=localhost /CACODE=0000-0000-0000'
          if (Test-Path "C:\Program Files\Dental Intake\client.json") { throw "installed despite wrong security code" }
          "wrong code refused (exit $($p.ExitCode))"

          $p = Start-Process desktop\dist\DentalIntakeSetup.exe -Wait -PassThru -ArgumentList `
            "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /LOG=C:\ws.log /ROLE=workstation /SERVER=localhost /CACODE=$code"
          if ($p.ExitCode -ne 0) { throw "workstation install failed: $($p.ExitCode)" }
          $client = Get-Content "C:\Program Files\Dental Intake\client.json" | ConvertFrom-Json
          if ($client.role -ne "workstation" -or $client.url -ne "https://localhost/staff") { throw "bad client.json" }
          # Trusted through the Windows certificate store the installer updated (no -SkipCertificateCheck).
          $r = Invoke-WebRequest -UseBasicParsing https://localhost/api/health
          if ($r.StatusCode -ne 200) { throw "workstation cannot reach server over trusted HTTPS" }
          if (-not (Test-Path "$env:PUBLIC\Desktop\Dental Intake.lnk")) { throw "desktop shortcut missing" }
          Start-Process "C:\Program Files\Dental Intake\unins000.exe" -Wait -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /LOG=C:\unins-ws.log'
          Stop-Process $srv -Force
          Start-Sleep 3
          if (Get-ChildItem Cert:\LocalMachine\Root | Where-Object Subject -like '*Dental Intake CA*') { throw "CA not removed on uninstall" }
          "workstation install OK"

      - name: "Main office PC install: service, HTTPS, firewall, permissions"
        run: |
          $p = Start-Process desktop\dist\DentalIntakeSetup.exe -Wait -PassThru -ArgumentList `
            '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /LOG=C:\install.log /ROLE=server /OFFICE="CI Dental" /ADMINNAME="CI Admin" /ADMINEMAIL=admin@ci.test /RESULTFILE=C:\result.txt'
          if ($p.ExitCode -ne 0) { throw "server install failed: $($p.ExitCode)" }
          $svc = Get-Service DentalIntake
          "service: $($svc.Status) / $($svc.StartType)"
          if ($svc.Status -ne "Running") { throw "service not running" }
          (Invoke-WebRequest -UseBasicParsing https://localhost/api/health).Content
          $httpPort = ((Get-Content C:\result.txt) -match '^ca_http_port=') -replace 'ca_http_port=', ''
          # PowerShell 7 returns non-text downloads as bytes: decode before checking.
          $ca = (Invoke-WebRequest -UseBasicParsing "http://localhost:$httpPort/office-ca.crt").Content
          if ($ca -is [byte[]]) { $ca = [Text.Encoding]::ASCII.GetString($ca) }
          if ($ca -notmatch "BEGIN CERTIFICATE") { throw "CA download" }
          if (-not (Get-ChildItem Cert:\LocalMachine\Root | Where-Object Subject -like '*CI Dental Dental Intake CA*')) { throw "CA not trusted" }
          netsh advfirewall firewall show rule name="Dental Intake HTTPS" | Select-String "LocalPort"
          $acl = (Get-Acl "C:\ProgramData\Dental Intake").Access | ForEach-Object { $_.IdentityReference.Value }
          "data folder access: $($acl -join ', ')"
          if ($acl -match 'Users') { throw "data folder readable by ordinary users" }
          if (-not (Test-Path "C:\ProgramData\Dental Intake\keys\intake-keys.json")) { throw "key file missing" }

      - name: Full patient visit against the installed service
        run: |
          $temp = ((Get-Content C:\result.txt) -match '^temporary_password=') -replace 'temporary_password=', ''
          python desktop\tests\windows_e2e.py --base https://localhost --ca "C:\ProgramData\Dental Intake\tls\office-ca.crt" --email admin@ci.test --temp-password $temp
          if ($LASTEXITCODE -ne 0) { throw "e2e failed" }

      - name: Backup, restart, tray icon, upgrade, uninstall
        timeout-minutes: 15
        run: |
          # Every external command gets a hard timeout and a marker, so a hang names itself.
          function Run-Timed($file, $argList, $seconds, $label) {
            "▶ $label"
            $p = Start-Process $file -ArgumentList $argList -PassThru -NoNewWindow
            if (-not $p.WaitForExit($seconds * 1000)) { Stop-Process $p -Force -ErrorAction SilentlyContinue; throw "$label timed out after $seconds s" }
            if ($p.ExitCode -ne 0) { throw "$label failed with exit code $($p.ExitCode)" }
          }
          $server = "C:\Program Files\Dental Intake\DentalIntakeServer.exe"
          Run-Timed $server "backup" 180 "backup"
          $zip = Get-ChildItem "C:\ProgramData\Dental Intake\backups\intake-backup-*.zip" | Select-Object -First 1
          "backup: $($zip.Name) $($zip.Length) bytes"

          "▶ restart service"
          $job = Start-Job { Restart-Service DentalIntake }
          if (-not (Wait-Job $job -Timeout 120)) { throw "service restart timed out" }
          Receive-Job $job
          Start-Sleep 8
          (Invoke-WebRequest -UseBasicParsing -TimeoutSec 30 https://localhost/api/health).StatusCode
          Run-Timed $server "status" 60 "status"

          "▶ tray icon"
          $tray = Start-Process "C:\Program Files\Dental Intake\Dental Intake.exe" -ArgumentList tray -PassThru
          Start-Sleep 8
          if ($tray.HasExited) { throw "tray exited with $($tray.ExitCode)" }
          Stop-Process $tray -Force
          "tray OK"

          # Upgrade in place keeps settings and data.
          Run-Timed "desktop\dist\DentalIntakeSetup.exe" "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /LOG=C:\upgrade.log" 300 "upgrade"
          if (Select-String -Path C:\upgrade.log -Pattern "Setup could not finish" -Quiet) { throw "upgrade: setup step failed (see cli.log below)" }
          Start-Sleep 8
          (Invoke-WebRequest -UseBasicParsing -TimeoutSec 30 https://localhost/api/health).StatusCode
          "▶ status after upgrade"
          & $server status | Select-String "submitted"
          # Regression check: after an upgrade, existing data files must still be readable (by admins and the service).
          Get-Content "C:\ProgramData\Dental Intake\config.json" -ErrorAction Stop | Out-Null
          "data files still readable after upgrade"

          # The uninstaller relaunches itself from a temp copy, so wait for the service to disappear instead.
          Run-Timed "C:\Program Files\Dental Intake\unins000.exe" "/VERYSILENT /SUPPRESSMSGBOXES /LOG=C:\unins.log" 300 "uninstall"
          for ($i = 0; $i -lt 60 -and (Get-Service DentalIntake -ErrorAction SilentlyContinue); $i++) { Start-Sleep 2 }
          if (Get-Service DentalIntake -ErrorAction SilentlyContinue) { throw "service not removed" }
          if (-not (Test-Path "C:\ProgramData\Dental Intake\intake.db")) { throw "office data should be kept on uninstall" }
          "uninstall OK (data kept)"

      - name: Logs on failure
        if: failure()
        run: |
          Get-Content C:\install.log, C:\ws.log, C:\upgrade.log -ErrorAction SilentlyContinue | Select-Object -Last 120
          Get-Content C:\unins-ws.log, C:\unins.log -ErrorAction SilentlyContinue | Select-String -Pattern 'Run|exit|error|fail' -CaseSensitive:$false | Select-Object -First 60
          # The service keeps some logs open: read them with sharing instead of Get-Content.
          Get-ChildItem "C:\ProgramData\Dental Intake\logs" -File -ErrorAction SilentlyContinue | ForEach-Object {
            "== $($_.Name)"
            try {
              $fs = [IO.File]::Open($_.FullName, 'Open', 'Read', 'ReadWrite')
              $lines = (New-Object IO.StreamReader($fs)).ReadToEnd() -split "`n"
              $fs.Close()
              $lines | Select-Object -Last 60
            } catch { "  (could not read: $($_.Exception.Message))" }
          }
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DentalIntakeSetup
          path: desktop/dist/DentalIntakeSetup.exe
          if-no-files-found: ignore

name: CI
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: intake, POSTGRES_PASSWORD: intake, POSTGRES_DB: intake_test }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - name: pytest (Postgres)
        run: pytest -q
        env: { TEST_DATABASE_URL: "postgresql+psycopg://intake:intake@localhost:5432/intake_test" }
      - name: migrations apply cleanly
        run: alembic upgrade head
        env:
          INTAKE_DATABASE_URL: postgresql+psycopg://intake:intake@localhost:5432/intake_test
          INTAKE_DATABASE_SSLMODE: disable

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci
      - run: npm run build

  infra:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: infra } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci
      - run: npm run build

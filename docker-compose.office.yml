# Office deployment: the whole program on one practice PC.
# Start it with office/office.ps1 (Windows) or office/office.sh (Mac/Linux),
# which create office/.env on first run.
name: dental-intake

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: intake
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run the office setup script first}
      POSTGRES_DB: intake
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intake -d intake"]
      interval: 5s
      retries: 20

  app:
    build: .
    image: dental-intake-app:latest
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      INTAKE_ENVIRONMENT: production
      INTAKE_DEPLOYMENT: office
      INTAKE_AUTH_MODE: local
      INTAKE_KEY_PROVIDER: file
      INTAKE_KEY_FILE: /data/keys/intake-keys.json
      INTAKE_STORAGE_BACKEND: local
      INTAKE_LOCAL_STORAGE_DIR: /data/files
      INTAKE_DATABASE_URL: postgresql+psycopg://intake:${POSTGRES_PASSWORD}@db:5432/intake
      # Postgres is reachable only on the private Docker network of this PC.
      INTAKE_DATABASE_SSLMODE: disable
      INTAKE_PUBLIC_BASE_URL: https://${SITE_HOST}
      INTAKE_OFFICE_TIMEZONE: ${OFFICE_TIMEZONE:-America/New_York}
      INTAKE_RETENTION_YEARS: ${RETENTION_YEARS:-10}
    volumes:
      - appdata:/data
    # Not published on the network; only Caddy (HTTPS) talks to it.
    expose: ["8000"]

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_HOST: ${SITE_HOST}
      TLS_MODE: ${TLS_MODE:-internal}
    volumes:
      - ./office/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  backup:
    image: postgres:16
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      PGHOST: db
      PGUSER: intake
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: intake
      BACKUP_HOUR: ${BACKUP_HOUR:-21}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
      TZ: ${OFFICE_TIMEZONE:-America/New_York}
    volumes:
      - ./office/backup.sh:/backup.sh:ro
      - appdata:/data:ro
      - ${BACKUP_DIR:-./backups}:/backups
    entrypoint: ["sh", "/backup.sh", "loop"]

volumes:
  pgdata:
  appdata:
  caddy_data:
  caddy_config:
